# Route publique (sonde de l'API, connexion) : pas de jeton, mais la limitation de débit et le reste s'appliquent.
js_header_filter auth.headers;
if ($request_method = OPTIONS) {
  rewrite ^ /_preflight last;
}
limit_req zone=api burst=40 nodelay;
include /etc/nginx/gateway/upstream.conf;
# Aucune identité n'est vérifiée ici : ce qu'un client écrirait dans ces en-têtes n'est pas transmis.
proxy_set_header X-User-Id "";
proxy_set_header X-User-Role "";
