# Route PUBLIQUE de l'application citoyenne (ADR-030, CIT-02) : pas de jeton, lecture seule, débit limité par adresse.
# Inclus par les `location` générés pour les chemins sous /api/v1/public/ (scripts/dev/gateway_routes.py).
js_header_filter auth.headers;      # Cache-Control, CORS et en-têtes de sécurité (auth.js)
if ($request_method = OPTIONS) {
  rewrite ^ /_preflight last;
}
limit_req zone=citoyen burst=10 nodelay;
# Un refus de débit est écrit dans le journal d'erreurs avec l'adresse du client : au niveau `info`, il n'y est pas (CIT-06).
limit_req_log_level info;
include /etc/nginx/gateway/upstream.conf;
# Un citoyen est anonyme : un jeton d'équipe, un cookie ou une identité que le client enverrait n'atteignent JAMAIS le service.
proxy_set_header Authorization "";
proxy_set_header Cookie "";
proxy_set_header X-User-Id "";
proxy_set_header X-User-Role "";
