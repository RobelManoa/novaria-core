# Route protégée : jeton valide et rôle suffisant, sinon la requête n'atteint jamais le service.
# (`auth_request` appelle /_auth : auth.js contrôle le jeton, le rôle exigé vient de routes.json.)
js_header_filter auth.headers;
if ($request_method = OPTIONS) {
  rewrite ^ /_preflight last;     # pré-vérification CORS : sans jeton, avant l'authentification
}
limit_req zone=api burst=40 nodelay;
auth_request /_auth;
auth_request_set $auth_user $sent_http_x_auth_user;
auth_request_set $auth_role $sent_http_x_auth_role;
include /etc/nginx/gateway/upstream.conf;
# Identité vérifiée, posée par la passerelle ; ce qu'un client aurait écrit dans ces en-têtes est écrasé.
proxy_set_header X-User-Id $auth_user;
proxy_set_header X-User-Role $auth_role;
