# GÉNÉRÉ par scripts/dev/gateway_routes.py depuis contracts/openapi/ : ne pas modifier à la main
# (python scripts/dev/gateway_routes.py). Un `location` par chemin des contrats : le service, les méthodes et
# le rôle exigé (routes.json, vérifié par auth.js) en viennent. Rien d'autre n'est routé.

  # alerte.openapi.yaml : GET viewer
  location = /api/v1/alert-rules {
    if ($request_method !~ ^(GET|OPTIONS)$) {
      add_header Allow "GET, OPTIONS" always;
      return 405 '{"type":"https://novaria.local/problems/method-not-allowed","title":"Méthode non permise","status":405,"code":"METHOD_NOT_ALLOWED","detail":"Cette méthode n est pas permise sur cette route.","correlation_id":"$correlation_id"}';
    }
    include /etc/nginx/gateway/protected.conf;
    proxy_pass http://alerte:8000;
  }

  # alerte.openapi.yaml : GET viewer
