  # api-metier.openapi.yaml : POST publique
  location = /api/v1/auth/login {
    if ($request_method !~ ^(OPTIONS|POST)$) {
      add_header Allow "OPTIONS, POST" always;
      return 405 '{"type":"https://novaria.local/problems/method-not-allowed","title":"Méthode non permise","status":405,"code":"METHOD_NOT_ALLOWED","detail":"Cette méthode n est pas permise sur cette route.","correlation_id":"$correlation_id"}';
    }
    include /etc/nginx/gateway/public.conf;
    limit_req zone=login burst=5 nodelay;
    proxy_pass http://traitement:8000;
  }

