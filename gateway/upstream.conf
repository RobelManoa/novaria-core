# L'envoi d'une requête à un service : ce que la passerelle transmet. Inclus par protected.conf et public.conf.
# Un `proxy_set_header` posé dans un `location` remplace tous ceux du niveau au-dessus : tout est donc redit ici.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Correlation-ID $correlation_id;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
