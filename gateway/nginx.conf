# Passerelle d'API locale (MS-06) : un point d'entrée, un routage par préfixe vers le service propriétaire
# (table de contracts/openapi/README.md). L'authentification JWT, la limitation de débit et CORS arrivent avec MS-13.
# Monté en lecture seule dans l'image nginxinc/nginx-unprivileged par docker-compose.yml.

# Identifiant de corrélation : repris de la requête s'il existe, généré sinon, transmis aux services et renvoyé.
map $http_x_correlation_id $correlation_id {
  default $http_x_correlation_id;
  ""      $request_id;
}

server {
  listen 8000;
  server_name _;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Correlation-ID $correlation_id always;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Correlation-ID $correlation_id;
  proxy_set_header X-Forwarded-For $remote_addr;

  # Sonde de la passerelle elle-même.
  location = /health {
    default_type application/json;
    return 200 '{"status":"ok","service":"passerelle"}';
  }

  # Sonde de l'API : tant que le service « API métier » n'est pas séparé du traitement, celui-ci la sert.
  location = /api/v1/health {
    proxy_pass http://traitement:8000;
  }

  location ~ ^/api/v1/(intersections|road-segments|indicators|forecasts)(/|$) {
    proxy_pass http://traitement:8000;
  }

  location ~ ^/api/v1/(alerts|alert-rules)(/|$) {
    proxy_pass http://alerte:8000;
  }

  # Flux SSE (Server-Sent Events) : pas de tampon, connexion longue.
  location = /api/v1/events/stream {
    proxy_pass http://alerte:8000;
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  location ~ ^/api/v1/signals(/|$) {
    proxy_pass http://reponse:8000;
  }

  # API métier (authentification, comptes) : portée par le traitement tant que le point ouvert n° 1 des
  # diagrammes C4 n'est pas tranché (BE-03). Le service contrôle lui-même le jeton ; la passerelle ne le
  # contrôle pas encore (MS-13).
  location ~ ^/api/v1/(auth|users)(/|$) {
    proxy_pass http://traitement:8000;
  }

  # Le dépôt des mesures est interne : le simulateur parle à la collecte, pas à la passerelle.
  location ^~ /api/v1/measurements {
    default_type application/problem+json;
    return 404 '{"type":"https://novaria.local/problems/not-found","title":"Introuvable","status":404,"code":"NOT_FOUND","detail":"Cette route n est pas exposée par la passerelle.","correlation_id":"$correlation_id"}';
  }

  location / {
    default_type application/problem+json;
    return 404 '{"type":"https://novaria.local/problems/not-found","title":"Introuvable","status":404,"code":"NOT_FOUND","detail":"Aucune route ne correspond.","correlation_id":"$correlation_id"}';
  }
}
