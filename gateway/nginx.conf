# Passerelle d'API (MS-06 routage ; MS-13 authentification, limitation de débit, CORS, en-têtes de sécurité).
#
# Fichier complet monté sur /etc/nginx/nginx.conf de l'image nginxinc/nginx-unprivileged (variante avec njs) par
# docker-compose.yml, avec le dossier gateway/ monté sur /etc/nginx/gateway (lecture seule).
#
#   nginx.conf      ce fichier : cadre commun, limites, pages d'erreur, sondes ;
#   routes.conf     GÉNÉRÉ depuis contracts/openapi/ : un `location` par route (service, méthodes) ;
#   routes.json     GÉNÉRÉ : le rôle exigé par route, lu par auth.js ;
#   protected.conf  ce que toute route protégée reçoit : jeton, rôle, limite de débit ;
#   public.conf     idem pour une route publique (sonde, connexion) : pas de jeton ;
#   upstream.conf   l'envoi vers un service (en-têtes transmis) ;
#   auth.js         njs : vérification du jeton, CORS, en-têtes de sécurité.
#
# Secrets : rien dans ce dossier. La clé des jetons (JWT_SECRET) vient de l'environnement du conteneur.

load_module modules/ngx_http_js_module.so;

worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /tmp/nginx.pid;

# Variables d'environnement lues par auth.js (njs ne voit que celles-ci). Aucune valeur n'est écrite ici.
env JWT_SECRET;
env ENVIRONMENT;
env CORS_ALLOWED_ORIGINS;

events {
  worker_connections 1024;
}

http {
  proxy_temp_path /tmp/proxy_temp;
  client_body_temp_path /tmp/client_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  keepalive_timeout 65;

  # Journal d'accès : jamais l'en-tête Authorization, jamais la chaîne de requête (`$uri`, pas `$request_uri`) :
  # un jeton collé dans une adresse par erreur n'y entre pas.
  log_format passerelle '$remote_addr "$request_method $uri" $status $request_time $correlation_id';
  access_log /dev/stdout passerelle;

  js_import auth from /etc/nginx/gateway/auth.js;

  # --- Adresse du client -------------------------------------------------------------------------------
  # Le front-end (nginx) et les autres relais du réseau Docker envoient l'adresse d'origine dans X-Forwarded-For ;
  # on ne la croit que d'un relais du réseau privé. Un client qui écrit lui-même cet en-tête depuis l'extérieur
  # n'est pas cru (limite assumée en local : voir README, « Limites »).
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  set_real_ip_from 127.0.0.1;
  real_ip_header X-Forwarded-For;
  real_ip_recursive off;

  # --- Limitation de débit (BE-08 : la connexion a aussi ses limites dans le service) --------------------
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;     # toutes les routes, par adresse
  limit_req_zone $binary_remote_addr zone=login:1m rate=10r/m;    # la connexion : bourrage d'identifiants
  limit_conn_zone $binary_remote_addr zone=streams:1m;            # flux SSE ouverts en même temps
  limit_req_status 429;
  limit_conn_status 429;

  # Délai conseillé au client refusé (secondes) : une requête par 50 ms pour l'API, une par 6 s pour la connexion.
  map $uri $retry_after {
    default 1;
    /api/v1/auth/login 6;
  }

  # Identifiant de corrélation : repris de la requête s'il est sobre, généré sinon. Il est écrit dans des corps JSON
  # et des en-têtes : une valeur avec guillemet, saut de ligne ou espace est remplacée, jamais recopiée.
  map $http_x_correlation_id $correlation_id {
    default $request_id;
    "~^[A-Za-z0-9._:-]{1,100}$" $http_x_correlation_id;
  }

  # Chemin « simple » : seulement des lettres, chiffres, `_`, `-`, `.` et `/`, sans `//`, ni `/.` ni `/..`. Le rôle
  # est décidé sur le chemin brut (auth.js) et le routage sur le chemin normalisé (nginx) : en n'acceptant que des
  # chemins où les deux sont identiques, aucune astuce d'encodage (`%2e`, `//`, `/./`) ne peut les faire diverger.
  map $request_uri $plain_path {
    default 0;
    "~(//|/\.(\.|/|\?|$))" 0;
    "~^/[A-Za-z0-9_./-]*(\?.*)?$" 1;
  }

  server {
    listen 8000;
    server_name _;

    # En-têtes de sécurité, CORS et corrélation : posés par auth.js (`js_header_filter auth.headers;`) sur TOUTES les
    # réponses, erreurs de la passerelle comprises, après avoir effacé ceux des services. njs n'accepte cette directive
    # que dans un `location` : elle est donc dans chaque `location` ci-dessous et dans protected.conf / public.conf.

    client_max_body_size 1m;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 8k;

    if ($plain_path = 0) {
      return 400 '{"type":"https://novaria.local/problems/validation-error","title":"Entrée invalide","status":400,"code":"VALIDATION_ERROR","detail":"Chemin non permis.","correlation_id":"$correlation_id"}';
    }

    # --- Erreurs de la passerelle : toujours au format Problem (contracts/openapi/common.yaml) ---------
    error_page 401 = @unauthorized;
    error_page 403 = @forbidden;
    error_page 429 = @too_many_requests;
    error_page 500 502 503 504 =503 @unavailable;

    location @unauthorized {
      js_header_filter auth.headers;
      default_type application/problem+json;
      add_header WWW-Authenticate Bearer always;
      return 401 '{"type":"https://novaria.local/problems/unauthenticated","title":"Authentification requise","status":401,"code":"UNAUTHENTICATED","detail":"Jeton absent, invalide ou expiré.","correlation_id":"$correlation_id"}';
    }

    location @forbidden {
      js_header_filter auth.headers;
      default_type application/problem+json;
      return 403 '{"type":"https://novaria.local/problems/forbidden","title":"Droit insuffisant","status":403,"code":"FORBIDDEN","detail":"Le rôle de ce jeton ne permet pas cette opération.","correlation_id":"$correlation_id"}';
    }

    location @too_many_requests {
      js_header_filter auth.headers;
      default_type application/problem+json;
      add_header Retry-After $retry_after always;
      return 429 '{"type":"https://novaria.local/problems/rate-limited","title":"Trop de requêtes","status":429,"code":"RATE_LIMITED","detail":"Trop de requêtes : réessayez dans un instant.","correlation_id":"$correlation_id"}';
    }

    location @unavailable {
      js_header_filter auth.headers;
      default_type application/problem+json;
      return 503 '{"type":"https://novaria.local/problems/upstream-unavailable","title":"Service indisponible","status":503,"code":"UPSTREAM_UNAVAILABLE","detail":"Le service demandé ou l authentification est indisponible.","correlation_id":"$correlation_id"}';
    }

    # --- Sous-requêtes internes (jamais atteignables de l'extérieur) ---------------------------------
    location = /_auth {
      internal;
      js_content auth.verify;
    }

    location = /_preflight {
      internal;
      js_header_filter auth.headers;
      limit_req zone=api burst=40 nodelay;
      js_content auth.preflight;
    }

    # --- Sonde de la passerelle elle-même ---------------------------------------------------------------
    location = /health {
      js_header_filter auth.headers;
      default_type application/json;
      return 200 '{"status":"ok","service":"passerelle"}';
    }

    # --- Routes des services : générées depuis les contrats OpenAPI -----------------------------------
    include /etc/nginx/gateway/routes.conf;

    # Le dépôt des mesures est interne : le simulateur parle à la collecte, pas à la passerelle.
    location ^~ /api/v1/measurements {
      js_header_filter auth.headers;
      default_type application/problem+json;
      return 404 '{"type":"https://novaria.local/problems/not-found","title":"Introuvable","status":404,"code":"NOT_FOUND","detail":"Cette route n est pas exposée par la passerelle.","correlation_id":"$correlation_id"}';
    }

    location / {
      js_header_filter auth.headers;
      default_type application/problem+json;
      return 404 '{"type":"https://novaria.local/problems/not-found","title":"Introuvable","status":404,"code":"NOT_FOUND","detail":"Aucune route ne correspond.","correlation_id":"$correlation_id"}';
    }
  }
}
