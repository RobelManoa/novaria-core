# Alembic : migrations du schéma `app` (API métier), BE-02.
#   python -m alembic upgrade head        (depuis ce dossier, avec APP_DATABASE_URL)
#   python scripts/dev/dev.py db-migrate-app   (construit l'adresse depuis .env, depuis la racine du dépôt)
# L'adresse de la base n'est jamais écrite ici : elle contient un mot de passe (variable APP_DATABASE_URL).

[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
# Les noms de révision sont fixés à la main (0001, 0002…) : lisibles, ordonnés, comme db/postgres/migrations.
truncate_slug_length = 40

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
