name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Scan hebdomadaire de main (le lundi à 06:00 UTC) : détecte les nouvelles failles des images de base
  # et des dépendances sans attendre une pull request. Seuls les jobs snyk et docker s'exécutent.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

# Le scan planifié a son propre groupe : il n'annule pas une exécution de main, et inversement.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'schedule' && 'planifie' || 'normal' }}
  cancel-in-progress: true

# Les noms de jobs ci-dessous sont les contrôles obligatoires de la branche main :
# backend, frontend, gitleaks, snyk, docker, sonarqube.
jobs:
  # Les jobs backend, snyk et docker parcourent services/*/ : un service ajouté sous services/ (voir
  # services/_gabarit et CONTRIBUTING.md) est contrôlé sans modifier ce fichier. Le nom du job reste « backend ».
  backend:
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip, cache-dependency-path: "services/*/requirements*.txt" }
      - name: Lint et tests de chaque service
        run: |
          for dir in services/*/; do
            name=$(basename "$dir")
            echo "::group::$name"
            python -m venv "$RUNNER_TEMP/venv-$name"
            py="$RUNNER_TEMP/venv-$name/bin/python"
            "$py" -m pip install -r "${dir}requirements-dev.txt"
            (cd "$dir" && "$py" -m ruff check . && "$py" -m ruff format --check . && "$py" -m pytest)
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v7
        with: { name: coverage-backend, path: "services/*/coverage.xml" }

  frontend:
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "22", cache: npm, cache-dependency-path: "frontend/package*.json" }
      - name: Installer les dépendances
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with: { name: coverage-frontend, path: frontend/coverage/lcov.info }

  gitleaks:
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Détection de secrets (historique complet)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --source /repo --redact --verbose

  snyk:
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - uses: snyk/actions/setup@master
      - name: Dépendances Python (SCA), chaque service sauf le gabarit
        run: |
          for dir in services/*/; do
            case "$(basename "$dir")" in _*) continue ;; esac
            pip install -r "${dir}requirements.txt"
            snyk test --file="${dir}requirements.txt" --package-manager=pip --severity-threshold=high
          done
      - name: Dépendances npm (SCA)
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          snyk test --severity-threshold=high
      - name: "Code source (SAST), sur main seulement (100 tests par mois en plan gratuit)"
        if: ${{ github.event_name == 'push' }}
        run: snyk code test --severity-threshold=high
      - name: Infrastructure as Code
        run: |
          if find infra/terraform -name "*.tf" | grep -q .; then snyk iac test infra/terraform --severity-threshold=high; else echo "Pas encore de Terraform"; fi

  docker:
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Construire l'image de chaque service (novaria-<service>)
        run: |
          for dir in services/*/; do
            name=$(basename "$dir"); name=${name#_}
            docker buildx build --load -t "novaria-$name:${{ github.sha }}" --build-arg GIT_SHA=${{ github.sha }} "$dir"
          done
      - uses: docker/build-push-action@v7
        with: { context: frontend, load: true, tags: "novaria-frontend:${{ github.sha }}" }
      - uses: snyk/actions/setup@master
      - name: Analyse des images
        run: |
          rc=0
          for dir in services/*/; do
            name=$(basename "$dir")
            case "$name" in _*) continue ;; esac
            snyk container test "novaria-$name:${{ github.sha }}" --file="${dir}Dockerfile" --policy-path=.snyk --severity-threshold=high || rc=1
          done
          snyk container test novaria-frontend:${{ github.sha }} --file=frontend/Dockerfile --policy-path=.snyk --severity-threshold=high || rc=1
          exit $rc

  sonarqube:
    if: ${{ github.event_name != 'schedule' }}
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v8
        with: { name: coverage-backend, path: services }
      - uses: actions/download-artifact@v8
        with: { name: coverage-frontend, path: frontend/coverage }
      - uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
