name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Scan hebdomadaire de main (le lundi à 06:00 UTC) : détecte les nouvelles failles des images de base
  # et des dépendances sans attendre une pull request. Seuls les jobs snyk et docker s'exécutent.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

# Le scan planifié a son propre groupe : il n'annule pas une exécution de main, et inversement.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'schedule' && 'planifie' || 'normal' }}
  cancel-in-progress: true

# Les noms de jobs ci-dessous sont les contrôles obligatoires de la branche main :
# backend, frontend, gitleaks, snyk, docker, sonarqube. Ils ne changent jamais de nom et n'ont aucun filtre de
# chemin : un contrôle ignoré resterait « en attente » et bloquerait la fusion.
#
# Les services sont contrôlés en matrice : « services » liste les dossiers de services/, « service » (une exécution
# par dossier) fait lint, tests et construction de l'image, et « backend » rassemble leurs résultats : il échoue si un
# seul service échoue. Un service ajouté sous services/ (voir services/_gabarit et CONTRIBUTING.md) est contrôlé sans
# modifier ce fichier. Les jobs snyk et docker parcourent aussi services/*/.
jobs:
  services:
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    outputs:
      liste: ${{ steps.liste.outputs.liste }}
    steps:
      - uses: actions/checkout@v7
      - id: liste
        name: Lister les services (les dossiers de services/ qui ont un requirements-dev.txt)
        run: |
          liste=$(for dir in services/*/; do [ -f "${dir}requirements-dev.txt" ] && basename "$dir"; done | jq -R . | jq -sc .)
          echo "Services : $liste"
          if [ "$liste" = "[]" ]; then echo "::error::Aucun service trouvé dans services/"; exit 1; fi
          echo "liste=$liste" >> "$GITHUB_OUTPUT"

  service:
    needs: services
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # un service en échec n'arrête pas les autres : le rapport montre tous les écarts
      matrix:
        service: ${{ fromJSON(needs.services.outputs.liste) }}
    defaults: { run: { working-directory: "services/${{ matrix.service }}" } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip, cache-dependency-path: "services/${{ matrix.service }}/requirements*.txt" }
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - name: Construire l'image du service
        run: docker build --build-arg GIT_SHA=${{ github.sha }} -t "novaria-controle:${{ github.sha }}" .
      - uses: actions/upload-artifact@v7
        with: { name: "coverage-service-${{ matrix.service }}", path: "services/${{ matrix.service }}/coverage.xml" }

  # Contrôle obligatoire « backend » : réussit seulement si la découverte et tous les services ont réussi.
  # « always() » le fait s'exécuter même quand un service a échoué (sinon il resterait « ignoré », donc en attente).
  backend:
    if: ${{ always() && github.event_name != 'schedule' }}
    needs: [services, service]
    runs-on: ubuntu-latest
    steps:
      - name: Tous les services doivent avoir réussi
        run: |
          echo "Découverte des services : ${{ needs.services.result }}"
          echo "Services (matrice)      : ${{ needs.service.result }}"
          test "${{ needs.services.result }}" = "success" && test "${{ needs.service.result }}" = "success"

  frontend:
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "22", cache: npm, cache-dependency-path: "frontend/package*.json" }
      - name: Installer les dépendances
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with: { name: coverage-frontend, path: frontend/coverage/lcov.info }

  gitleaks:
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Détection de secrets (historique complet)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --source /repo --redact --verbose

  snyk:
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - uses: snyk/actions/setup@master
      - name: Dépendances Python (SCA), chaque service sauf le gabarit
        run: |
          for dir in services/*/; do
            case "$(basename "$dir")" in _*) continue ;; esac
            pip install -r "${dir}requirements.txt"
            snyk test --file="${dir}requirements.txt" --package-manager=pip --severity-threshold=high
          done
      - name: Dépendances npm (SCA)
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          snyk test --severity-threshold=high
      - name: "Code source (SAST), sur main seulement (100 tests par mois en plan gratuit)"
        if: ${{ github.event_name == 'push' }}
        run: snyk code test --severity-threshold=high
      - name: Infrastructure as Code
        run: |
          if find infra/terraform -name "*.tf" | grep -q .; then snyk iac test infra/terraform --severity-threshold=high; else echo "Pas encore de Terraform"; fi

  docker:
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Construire l'image de chaque service (novaria-<service>)
        run: |
          for dir in services/*/; do
            name=$(basename "$dir"); name=${name#_}
            docker buildx build --load -t "novaria-$name:${{ github.sha }}" --build-arg GIT_SHA=${{ github.sha }} "$dir"
          done
      - uses: docker/build-push-action@v7
        with: { context: frontend, load: true, tags: "novaria-frontend:${{ github.sha }}" }
      - uses: snyk/actions/setup@master
      - name: Analyse des images
        run: |
          rc=0
          for dir in services/*/; do
            name=$(basename "$dir")
            case "$name" in _*) continue ;; esac
            snyk container test "novaria-$name:${{ github.sha }}" --file="${dir}Dockerfile" --policy-path=.snyk --severity-threshold=high || rc=1
          done
          snyk container test novaria-frontend:${{ github.sha }} --file=frontend/Dockerfile --policy-path=.snyk --severity-threshold=high || rc=1
          exit $rc

  sonarqube:
    if: ${{ github.event_name != 'schedule' }}
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v8
        with: { pattern: "coverage-service-*", path: coverage-services }
      - name: Remettre la couverture de chaque service à sa place (services/<nom>/coverage.xml)
        run: |
          for dir in coverage-services/coverage-service-*/; do
            name=$(basename "$dir"); name=${name#coverage-service-}
            cp "${dir}coverage.xml" "services/$name/coverage.xml"
          done
      - uses: actions/download-artifact@v8
        with: { name: coverage-frontend, path: frontend/coverage }
      - uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
