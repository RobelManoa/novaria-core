# Environnement local de référence (ADR-023 : exécution locale d'abord ; ADR-024 : bases de données).
# Mêmes commandes sous Windows (PowerShell) et sous Linux : Docker Desktop ou Docker Engine suffit.
#
#   python scripts/dev/dev.py init-env     # crée .env avec des mots de passe aléatoires (une seule fois)
#   python scripts/dev/dev.py db-up        # PostgreSQL + MongoDB + migrations (sans backend ni frontend)
#   python scripts/dev/dev.py up           # tout : bases, backend, frontend
#   python scripts/dev/dev.py db-check     # vérifie rôles, droits et collections
#   python scripts/dev/dev.py kafka-up     # Kafka (mode KRaft), un seul broker
#   python scripts/dev/dev.py kafka-topics # crée les 6 sujets du bus (ADR-009) et les liste
#
# Les ports ne sont publiés que sur 127.0.0.1 : les bases et le bus ne sont pas joignables depuis le réseau.
name: novaria-core

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?créer .env avec : python scripts/dev/dev.py init-env}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?créer .env avec : python scripts/dev/dev.py init-env}"
      POSTGRES_DB: "${POSTGRES_DB:?créer .env avec : python scripts/dev/dev.py init-env}"
      PG_PASSWORD_APP: "${PG_PASSWORD_APP:?créer .env avec : python scripts/dev/dev.py init-env}"
      PG_PASSWORD_TRAITEMENT: "${PG_PASSWORD_TRAITEMENT:?créer .env avec : python scripts/dev/dev.py init-env}"
      PG_PASSWORD_ALERTE: "${PG_PASSWORD_ALERTE:?créer .env avec : python scripts/dev/dev.py init-env}"
      PG_PASSWORD_LECTURE: "${PG_PASSWORD_LECTURE:?créer .env avec : python scripts/dev/dev.py init-env}"
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1 : pendant l'initialisation, le serveur temporaire n'écoute que sur une socket Unix ;
      # le test ne réussit donc qu'une fois l'initialisation terminée.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # Tâche unique : applique les migrations SQL (db/postgres/migrations) puis s'arrête.
  db-migrate:
    image: postgres:16-alpine
    user: postgres
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      PGOPTIONS: "-c client_min_messages=warning"
    volumes:
      - ./db/postgres/migrate.sh:/usr/local/bin/migrate.sh:ro
      - ./db/postgres/migrations:/migrations:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/migrate.sh"]
    restart: "no"

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_ROOT_USER:?créer .env avec : python scripts/dev/dev.py init-env}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_ROOT_PASSWORD:?créer .env avec : python scripts/dev/dev.py init-env}"
      MONGO_INITDB_DATABASE: "${MONGO_DB:?créer .env avec : python scripts/dev/dev.py init-env}"
      MONGO_DB: ${MONGO_DB}
      MONGO_PASSWORD_COLLECTE: "${MONGO_PASSWORD_COLLECTE:?créer .env avec : python scripts/dev/dev.py init-env}"
      MONGO_PASSWORD_TRAITEMENT: "${MONGO_PASSWORD_TRAITEMENT:?créer .env avec : python scripts/dev/dev.py init-env}"
      MONGO_PASSWORD_REPONSE: "${MONGO_PASSWORD_REPONSE:?créer .env avec : python scripts/dev/dev.py init-env}"
      MONGO_PASSWORD_BACKEND: "${MONGO_PASSWORD_BACKEND:?créer .env avec : python scripts/dev/dev.py init-env}"
      MONGO_PASSWORD_ML: "${MONGO_PASSWORD_ML:?créer .env avec : python scripts/dev/dev.py init-env}"
      RAW_EVENTS_TTL_SECONDS: ${RAW_EVENTS_TTL_SECONDS:-1209600}
      REJECTS_TTL_SECONDS: ${REJECTS_TTL_SECONDS:-2592000}
    ports: ["127.0.0.1:${MONGO_PORT:-27017}:27017"]
    volumes:
      - mongodata:/data/db
      - ./db/mongo/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Connexion authentifiée avec un utilisateur de service : réussit seulement une fois l'initialisation
      # terminée (le serveur temporaire d'initialisation écoute déjà en local avant la création des utilisateurs).
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet -u svc_backend -p "$$MONGO_PASSWORD_BACKEND" --authenticationDatabase "$$MONGO_DB"
          "$$MONGO_DB" --eval "db.runCommand({ping: 1}).ok" | grep -q 1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  # Bus d'événements (ADR-009, LOC-04) : un seul broker en mode KRaft (Kafka Raft, sans ZooKeeper).
  # Deux écouteurs : « kafka:9092 » pour les conteneurs du réseau Compose, « 127.0.0.1:KAFKA_PORT » pour le poste.
  # Pas d'authentification ni de chiffrement en local (le port n'est joignable que depuis ce poste) ;
  # la matrice d'accès par service est prévue par CLD-18. Les sujets ne sont pas créés automatiquement :
  # `dev.py kafka-topics` les crée.
  kafka:
    image: apache/kafka:4.3.1
    environment:
      CLUSTER_ID: "novaria-local-kraft-01"
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:${KAFKA_PORT:-9094}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    ports: ["127.0.0.1:${KAFKA_PORT:-9094}:9094"]
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      # Réussit seulement quand le broker répond à une requête d'API : l'élection du contrôleur est terminée.
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 15s
      retries: 12
      start_period: 20s

  backend:
    build:
      context: ./services/traitement
      args:
        GIT_SHA: ${GIT_SHA:-local}
    environment:
      ENVIRONMENT: local
      GIT_SHA: ${GIT_SHA:-local}
      POSTGRES_URL: postgresql+psycopg://svc_app:${PG_PASSWORD_APP}@postgres:5432/${POSTGRES_DB}
      MONGO_URL: mongodb://svc_backend:${MONGO_PASSWORD_BACKEND}@mongo:27017/${MONGO_DB}?authSource=${MONGO_DB}
      MONGO_DB: ${MONGO_DB}
      JWT_SECRET: ${JWT_SECRET}
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db-migrate: { condition: service_completed_successfully }
      mongo: { condition: service_healthy }

  frontend:
    build: ./frontend
    ports: ["127.0.0.1:8080:8080"]
    depends_on: [backend]

  # --- Sauvegardes (profil « ops », jamais démarrées par `docker compose up`) --------------------------
  backup-postgres:
    profiles: ["ops"]
    image: postgres:16-alpine
    user: root
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      PGOPTIONS: "-c client_min_messages=warning"
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
    volumes:
      - ./db/postgres/ops.sh:/usr/local/bin/ops.sh:ro
      - ./backups:/backups
    entrypoint: ["/bin/sh", "/usr/local/bin/ops.sh"]
    command: ["backup"]
    restart: "no"

  backup-mongo:
    profiles: ["ops"]
    image: mongo:7
    user: root
    depends_on:
      mongo: { condition: service_healthy }
    environment:
      MONGO_HOST: mongo
      MONGO_PORT: "27017"
      MONGO_ROOT_USER: ${MONGO_ROOT_USER}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_DB: ${MONGO_DB}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
    volumes:
      - ./db/mongo/ops.sh:/usr/local/bin/ops.sh:ro
      - ./backups:/backups
    entrypoint: ["/bin/sh", "/usr/local/bin/ops.sh"]
    command: ["backup"]
    restart: "no"

volumes:
  pgdata:
  mongodata:
  kafkadata:
