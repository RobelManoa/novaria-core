# Environnement local : PostgreSQL + MongoDB + backend + frontend.
# Démarrage : cp .env.example .env && docker compose up --build
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ["127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    ports: ["127.0.0.1:${MONGO_HOST_PORT:-27017}:27017"]
    volumes: ["mongodata:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      args:
        GIT_SHA: ${GIT_SHA:-local}
    environment:
      ENVIRONMENT: local
      GIT_SHA: ${GIT_SHA:-local}
      POSTGRES_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MONGO_URL: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017
      MONGO_DB: ${MONGO_DB}
      JWT_SECRET: ${JWT_SECRET}
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      mongo: { condition: service_healthy }

  frontend:
    build: ./frontend
    ports: ["8080:8080"]
    depends_on: [backend]

volumes:
  pgdata:
  mongodata:
