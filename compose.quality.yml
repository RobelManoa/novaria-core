# SonarQube Community Build en local (analyse avant poussée) :
#   docker compose -f compose.quality.yml up -d      -> http://localhost:9000
# Prérequis Linux : sudo sysctl -w vm.max_map_count=262144
services:
  sonar-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:-sonar-local-only}
      POSTGRES_DB: sonar
    volumes: ["sonar-db:/var/lib/postgresql/data"]

  sonarqube:
    image: sonarqube:community
    depends_on: [sonar-db]
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:-sonar-local-only}
    ports: ["9000:9000"]
    volumes: ["sonar-data:/opt/sonarqube/data", "sonar-ext:/opt/sonarqube/extensions"]

volumes:
  sonar-db:
  sonar-data:
  sonar-ext:
