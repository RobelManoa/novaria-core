sonar.organization=robelmanoa
sonar.projectKey=RobelManoa_novaria-core
sonar.projectName=Novaria Core
sonar.sources=services,frontend/src,frontend/tests,data,ml
sonar.test.inclusions=**/tests/**,**/*.test.ts,**/*.test.tsx
# frontend/src/types/api/ est généré par « npm run api:generate » depuis contracts/openapi/ (vérifié à jour par
# frontend/tests/services/api-types.test.ts) : chaque fichier répète les schémas communs, ce n'est pas du code écrit.
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/migrations/**,**/*.md,frontend/src/types/api/**
sonar.python.version=3.12
# data/etl/coverage.xml : couverture des pipelines d'ingestion et de nettoyage (job « etl » de la CI), mesurée depuis data/etl.
sonar.python.coverage.reportPaths=services/*/coverage.xml,data/etl/coverage.xml
# Le gabarit et les services copient le même code commun (journaux, modèles d'événements, tests de conformité) :
# ces fichiers sont vérifiés identiques par scripts/dev/test_gabarit.py (CODE_COMMUN), cette copie voulue n'est pas
# de la duplication. Tout autre fichier d'un service reste soumis à la détection.
sonar.cpd.exclusions=services/_gabarit/**,services/*/app/core/logs.py,services/*/app/schemas/events.py,services/*/tests/unit/test_logs.py,services/*/tests/contract/conftest.py,services/*/tests/contract/test_event_models.py,services/*/tests/contract/test_openapi_contract.py
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.qualitygate.wait=true
