server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://passerelle:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # L'adresse du navigateur, pour la limitation de débit de la passerelle (sinon tous les utilisateurs du
    # front-end auraient l'adresse du conteneur et partageraient une seule limite).
    proxy_set_header X-Forwarded-For $remote_addr;
    # La passerelle pose déjà ces trois en-têtes : le front-end pose les siens sur toutes ses réponses ; un seul exemplaire.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
  }
  # Flux d'alertes en direct (SSE) : sans tampon, connexion longue. Avec le tampon par défaut, les événements
  # n'arriveraient au navigateur que par paquets, ou jamais.
  location = /api/v1/events/stream {
    proxy_pass http://passerelle:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_buffering off;
    proxy_read_timeout 1h;
    # La passerelle pose déjà ces trois en-têtes : le front-end pose les siens sur toutes ses réponses ; un seul exemplaire.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
  }
  location / {
    try_files $uri /index.html;
  }
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
}
